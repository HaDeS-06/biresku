<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biresku | Yönlendiriliyorsunuz</title>
  <meta name="description" content="Biresku Sanat & Kültür Platformu resmi karşılama ve yönlendirme sayfası.">
  
  <meta http-equiv="refresh" content="4;url=/dergi">

  <!-- Google Fonts: Editorial Serif & Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f1013;
      --card-bg: #15161b;
      --border: #242630;
      --accent: #c09a58;
      --accent-hover: #d8b26e;
      --text: #f0f1f5;
      --text-muted: #9fa3b2;
      --text-dim: #646877;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-reading: 'Cormorant Garamond', Garamond, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 24px;
      position: relative;
    }

    .gateway-card {
      max-width: 460px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 44px 36px 36px;
      text-align: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
    }

    .brand-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .brand-logo {
      font-family: var(--font-serif);
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-family: var(--font-reading);
      font-size: 1.15rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .redirect-status {
      background: #111217;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px 18px;
      margin-bottom: 24px;
    }

    .redirect-status p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .countdown-val {
      color: var(--accent);
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: var(--accent);
      color: #0b0c10;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .enter-btn:hover {
      background: var(--accent-hover);
    }

    .target-hint {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .target-hint:hover { color: var(--accent); }

    .card-footer {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <main class="gateway-card">
    <div class="brand-kicker">Resmi Giriş Portalı</div>
    <h1 class="brand-logo">BIRESKU</h1>
    <p class="brand-subtitle">Birleşmiş Ressamlar Kulübü</p>

    <div class="redirect-status">
      <p><span class="countdown-val" id="countNum">4</span> saniye içinde dergi sayfasına aktarılıyorsunuz...</p>
      <div class="progress-track">
        <div class="progress-bar" id="barFill"></div>
      </div>
    </div>

    <a href="/dergi" class="enter-btn">
      <span>Dergiyi Aç</span>
      <span>&rarr;</span>
    </a>

    <div>
      <a href="/dergi" class="target-hint">Hedef: biresku.com/dergi</a>
    </div>

    <footer class="card-footer">
      &copy; 2026 Biresku Sanat Yayıncılığı
    </footer>
  </main>

  <script>
    const TARGET = "/dergi";
    const TOTAL_MS = 4000;
    const start = Date.now();
    const countEl = document.getElementById("countNum");
    const fillEl = document.getElementById("barFill");

    const timer = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.min((elapsed / TOTAL_MS) * 100, 100);
      fillEl.style.width = pct + "%";

      const left = Math.max(0, Math.ceil((TOTAL_MS - elapsed) / 1000));
      countEl.textContent = left;

      if (elapsed >= TOTAL_MS) {
        clearInterval(timer);
        window.location.href = TARGET;
      }
    }, 50);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biresku | Yönlendiriliyorsunuz</title>
  <meta http-equiv="refresh" content="3;url=/dergi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at top center, #1a1b26 0%, #0c0d14 100%);
      --accent: #c5a059;
      --accent-hover: #dfb76c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #f3f4f6;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 28px;
    }
    h1 { font-family: 'Cinzel', serif; font-size: 2.2rem; margin-bottom: 12px; }
    p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #a87f3b 100%);
      color: #0b0c12;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BIRESKU</h1>
    <p>Sayfa bulunamadı. Dergi sayfasına aktarılıyorsunuz...</p>
    <a href="/dergi" class="btn">Dergiyi Aç</a>
  </div>
  <script>
    setTimeout(() => { window.location.href = "/dergi"; }, 3000);
  </script>
</body>
</html>
